<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Signal Lost · Humphrey Diaz</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }
  :root {
    --bg: #04070a; --cyan: #00fbff; --green: #05f76e;
    --glitch: #ff2e97; --muted: #7d8b9b; --bright: #eafcff;
    --grad: linear-gradient(100deg, var(--green), var(--cyan));
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--muted);
    font-family: 'Chakra Petch', system-ui, sans-serif;
    text-align: center;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(100% 70% at 50% 40%, rgba(0,251,255,.10), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.32) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  main { position: relative; }
  .code {
    font-size: clamp(5rem, 26vw, 14rem);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.04em;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(5,247,110,.35));
    position: relative;
  }
  .code::before, .code::after {
    content: '404';
    position: absolute; inset: 0;
    -webkit-text-fill-color: currentColor;
    background: none;
  }
  .code::before { color: var(--cyan); animation: ga 2.6s steps(2,end) infinite; }
  .code::after  { color: var(--glitch); animation: gb 2.6s steps(2,end) infinite; }
  @keyframes ga {
    0%,88%,100% { opacity: 0; transform: none; }
    90% { opacity: .8; transform: translateX(-5px); clip-path: inset(12% 0 62% 0); }
    94% { opacity: .8; transform: translateX(4px);  clip-path: inset(58% 0 18% 0); }
  }
  @keyframes gb {
    0%,88%,100% { opacity: 0; transform: none; }
    91% { opacity: .7; transform: translateX(5px);  clip-path: inset(48% 0 30% 0); }
    96% { opacity: .7; transform: translateX(-4px); clip-path: inset(8% 0 76% 0); }
  }
  h1 {
    font-family: var(--mono);
    font-size: clamp(.8rem, 2.6vw, 1rem);
    font-weight: 700;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--bright);
    margin: 1.25rem 0 .75rem;
  }
  p { font-size: .95rem; max-width: 42ch; margin: 0 auto 2rem; line-height: 1.7; }
  .home {
    display: inline-flex; align-items: center; gap: .6rem;
    font-family: var(--mono); font-size: .75rem; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; text-decoration: none;
    color: #00141a; background: var(--grad);
    padding: .9rem 1.7rem;
    box-shadow: 0 0 26px rgba(0,251,255,.28);
    transition: transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s;
  }
  .home:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(0,251,255,.5); }
  @media (prefers-reduced-motion: reduce) {
    .code::before, .code::after { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>Signal Lost</h1>
    <p>That route isn't in the system. The page may have moved, or the link was mistyped.</p>
    <a class="home" href="/"><span>Return to base</span><span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
